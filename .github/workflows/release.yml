name: Prepare hosted release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.actor == 'SirDragonheart' && github.triggering_actor == 'SirDragonheart'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/package-hosted.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-sanity-check-${{ github.sha }}
          path: .runtime/hosted-release/
          if-no-files-found: error
          retention-days: 30
